name: Node.js CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      # package.json currently has no "lint" script. --if-present keeps CI
      # usable until one is added, without inventing a replacement command.
      - name: Run lint
        run: npm run lint --if-present

      # package.json currently has no "build" script. --if-present keeps CI
      # usable until one is added, without inventing a replacement command.
      - name: Build
        run: npm run build --if-present

      - name: Audit dependencies
        run: npm audit --audit-level=high
